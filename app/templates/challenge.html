<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ challenge_name }} - LeetGPU</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <a href="/">← 返回</a>
    <h1>{{ challenge_name }}</h1>
    {% if result_summary %}
      <div class="banner">{{ result_summary }}</div>
    {% endif %}
  </header>

  <section>
    <h2>题目描述</h2>
    {% if html %}
      <div class="problem" >{{ html | safe }}</div>
    {% else %}
      <p>暂无题目描述。</p>
    {% endif %}
  </section>

  <section>
    <h2>选择 GPU 并运行示例测试（参考实现）</h2>
    <form method="post" action="/challenge/{{ challenge.difficulty }}/{{ challenge.folder_name }}/run">
      <label for="gpu">GPU:</label>
      <select id="gpu" name="gpu">
        {% for gpu in gpus %}
          <option value="{{ gpu.index }}">#{{ gpu.index }} (物理: {{ gpu.physical_index }}) - {{ gpu.name }}</option>
        {% endfor %}
      </select>
      <button type="submit">运行</button>
    </form>
  </section>
</body>
</html>
