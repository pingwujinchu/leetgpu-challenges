version: '3.8'

services:
  leetgpu-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leetgpu-website
    ports:
      - "5000:5000"
    volumes:
      # 挂载题目目录（只读）
      - ../challenges:/app/../challenges:ro
      # 挂载元数据文件（如果需要实时更新）
      - ./challenges.json:/app/challenges.json
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - leetgpu-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/stats')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.leetgpu.description=LeetGPU Online Testing Website"
      - "com.leetgpu.version=1.0"

networks:
  leetgpu-network:
    driver: bridge

